<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>個人動態自我介紹網站 - 修正版</title>

  <!-- Cropper.js CSS (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" integrity="" crossorigin="anonymous" />

  <!-- EmailJS SDK (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --primary-color: #4f46e5;
      --nav-bg: rgba(255,255,255,0.8);
      --transition-speed: 0.28s;
    }
    [data-theme="dark"]{
      --bg-color:#0f172a; --text-color:#f8fafc; --primary-color:#818cf8; --nav-bg: rgba(15,23,42,0.8);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html { scroll-behavior: smooth; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",Helvetica,Arial,sans-serif; }
    body{background:var(--bg-color);color:var(--text-color);line-height:1.6;transition:background var(--transition-speed),color var(--transition-speed)}
    .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 10%; background: var(--nav-bg); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 1000; }
    [data-theme="dark"] .navbar { border-bottom-color: rgba(255,255,255,0.05); }
    .logo { font-weight:700; color:var(--primary-color); font-size:1.3rem; }
    .nav-links { display:flex; align-items:center; }
    .nav-links a { color:var(--text-color); text-decoration:none; margin-left:2.5rem; font-weight:600; }
    .theme-btn { background:none; border:none; font-size:1.2rem; padding:6px; margin-left:2.5rem; border-radius:50%; cursor:pointer; }

    main { padding-top: 90px; }

    .section-wrapper { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px 40px 20px; }
    .card { width:100%; max-width:900px; }

    .hero-inner { margin:0 auto; display:grid; gap:1.2rem; align-items:center; }
    .hero-title { font-size:2rem; font-weight:800; text-align:center; }

    .avatar-preview-box { width:150px; height:150px; border-radius:50%; overflow:hidden; border:4px solid var(--primary-color); background:#f1f5f9; margin:0 auto; display:grid; place-items:center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .avatar-preview-img { width:100%; height:100%; object-fit:cover; display:block; }

    .hero-input-box, .project-manager-panel, .contact-form {
      background:var(--bg-color); padding:1.6rem; border-radius:12px; border:1px solid rgba(0,0,0,0.05); box-shadow:0 10px 30px rgba(0,0,0,0.04); text-align: left;
    }
    [data-theme="dark"] .hero-input-box, [data-theme="dark"] .project-manager-panel, [data-theme="dark"] .contact-form {
      border-color: rgba(255,255,255,0.05); box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .form-group { margin-bottom:1rem; position: relative; }
    .form-group label { display:block; margin-bottom:0.35rem; font-weight:600; font-size: 0.95rem; }
    .form-group input, .form-group textarea { width:100%; padding:0.6rem 0.85rem; border-radius:8px; border:1px solid #cbd5e1; background:var(--bg-color); color:var(--text-color); outline: none; transition: border-color 0.2s; }
    [data-theme="dark"] .form-group input, [data-theme="dark"] .form-group textarea { border-color: #334155; }
    .form-group input:focus, .form-group textarea:focus { border-color:var(--primary-color); box-shadow:0 0 0 3px rgba(79,70,229,0.08); }
    .form-group.invalid input, .form-group.invalid textarea, .file-upload-wrapper.invalid { border-color:#ef4444 !important; }
    .error-msg { display:none; color:#ef4444; margin-top:0.35rem; font-weight:600; font-size: 0.85rem; }
    .form-group.invalid .error-msg { display:block; }

    .file-upload-wrapper { border:2px dashed #cbd5e1; border-radius:8px; padding:1rem; text-align:center; cursor:pointer; user-select:none; transition: border-color 0.2s; }
    .file-upload-wrapper:hover { border-color: var(--primary-color); }
    .file-status { color:#64748b; font-size:0.95rem; font-weight: 500; }

    .projects-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:1rem; margin-top:1rem; width: 100%; }
    .project-card { border-radius:10px; overflow:hidden; background:var(--bg-color); box-shadow:0 4px 15px rgba(0,0,0,0.05); display:flex; flex-direction:column; }
    .card-img-box { height:140px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .card-img { width:100%; height:100%; object-fit:cover; }
    .card-content { padding:0.8rem; }
    .card-title { font-weight:700; margin-bottom:0.25rem; font-size: 1rem; }
    .card-text { color:#64748b; font-size:0.9rem; word-break: break-word; }

    .submit-btn { width:100%; padding:0.7rem; border-radius:8px; border:none; background:var(--primary-color); color:#fff; font-weight:700; cursor:pointer; font-size: 1rem; transition: background 0.2s; }
    .submit-btn:disabled { background: #cbd5e1; color: #94a3b8; cursor:not-allowed; opacity: 0.8; }

    .crop-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); align-items:center; justify-content:center; z-index:2000; padding:1rem; }
    .modal-content { width:100%; max-width:520px; border-radius:12px; padding:1rem; background:var(--bg-color); color:var(--text-color); text-align: center; }
    .crop-container { max-height:320px; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:0.75rem; }

    #success-overlay-screen { display: none; position: fixed; inset: 0; z-index: 9999; background: var(--bg-color); color: var(--text-color); align-items: center; justify-content: center; text-align: center; flex-direction: column; padding: 20px; }
    .success-card { max-width:480px; padding:2rem; background:var(--bg-color); border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.03); }
    .success-icon { font-size:3rem; margin-bottom:0.6rem; color:#16a34a; }
    .success-card h2 { font-size:1.4rem; font-weight:800; margin-bottom:0.6rem; color: #16a34a; }
    .success-card p { color:#64748b; font-size:1rem; line-height:1.5; }

    footer { padding:2rem; text-align:center; color:#64748b; border-top:1px solid rgba(0,0,0,0.05); margin-top:2rem; }
    @media(max-width:968px) { .navbar { padding:0 5%; } .projects-grid { grid-template-columns:1fr; } .hero-title { font-size:1.6rem; } }
  </style>
</head>
<body>

  <nav class="navbar" role="navigation" aria-label="主選單">
    <div class="logo">Portfolio</div>
    <div class="nav-links">
      <a href="#home">首頁</a>
      <a href="#projects">作品</a>
      <a href="#contact">聯絡我</a>
      <button id="theme-toggle" class="theme-btn" aria-label="切換深色模式">🌙</button>
    </div>
  </nav>

  <div id="whole-page-wrapper">
    <main>
      <!-- HERO -->
      <section class="section-wrapper" id="home" aria-labelledby="hero-title">
        <div class="card hero-inner">
          <div style="text-align:center;">
            <div class="avatar-preview-box" aria-hidden="true">
              <img id="avatar-preview" class="avatar-preview-img"
                src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23f1f5f9'/%3E%3Ccircle cx='12' cy='8' r='4' fill='%23c7d2fe'/%3E%3Cpath d='M4 20c0-3.3137 2.6863-6 6-6h4c3.3137 0 6 2.6863 6 6' fill='%23c7d2fe'/%3E%3C/svg%3E"
                alt="預設頭像" />
            </div>
            <div style="margin-top:0.6rem;">
              <button id="avatar-upload-trigger" class="avatar-upload-btn" type="button">調整大頭貼範圍 (圓形裁剪)</button>
              <input id="avatar-input" type="file" accept="image/*" style="display:none" />
            </div>
          </div>

          <div class="hero-input-box" style="margin-top:1rem;">
            <div id="hero-name-group" class="form-group">
              <label for="name-custom-input">顯示名稱（必填）</label>
              <input id="name-custom-input" type="text" placeholder="輸入您的名字" aria-required="true" />
              <div class="error-msg">顯示名稱不能為空，請輸入您的名字！</div>
            </div>
            <h1 id="hero-title-text" class="hero-title">哈囉，我叫名字</h1>
          </div>
        </div>
      </section>

      <!-- PROJECTS -->
      <section class="section-wrapper projects-section" id="projects" aria-labelledby="projects-title">
        <div class="card project-manager-panel">
          <h2 id="projects-title" style="margin-bottom:0.75rem;">作品上傳（請填齊 3 個）</h2>

          <div id="file-group-container" class="form-group">
            <div id="file-dropzone" class="file-upload-wrapper" role="button" tabindex="0" aria-label="點擊以選擇作品檔案">
              <div class="file-status" id="file-status-text">📂 點擊選擇作品檔案 (圖片 / PDF / ZIP 等)</div>
            </div>
            <input id="project-file-input" type="file" accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.zip" style="display:none" />
            <div class="error-msg">請選擇作品檔案。</div>
          </div>

          <div id="title-group-container" class="form-group">
            <label for="project-title-input">作品標題（必填）</label>
            <input id="project-title-input" type="text" placeholder="作品標題" />
            <div class="error-msg">請輸入標題</div>
          </div>

          <div id="desc-group-container" class="form-group">
            <label for="project-desc-input">作品說明（必填）</label>
            <textarea id="project-desc-input" rows="3" placeholder="請輸入作品說明"></textarea>
            <div class="error-msg">請輸入作品說明</div>
          </div>

          <div style="display:flex;gap:0.6rem;align-items:center;">
            <button id="add-project-btn" class="submit-btn" type="button">新增作品卡</button>
            <div id="project-counter-badge" class="counter-badge" style="margin-left:0.6rem">已收集: 0 / 3 個</div>
          </div>

          <div id="dynamic-projects-container" class="projects-grid" aria-live="polite" style="margin-top:1rem;"></div>
        </div>
      </section>

      <!-- CONTACT -->
      <section class="section-wrapper" id="contact" aria-labelledby="contact-title">
        <div class="card contact-form" style="max-width:700px;">
          <h2 id="contact-title" style="margin-bottom:0.6rem;">聯絡我（上傳 3 件作品後可發送）</h2>
          <form id="contact-form" novalidate>
            <div id="name-group" class="form-group">
              <label for="user-name">您的姓名（必填）</label>
              <input id="user-name" type="text" placeholder="您的姓名" required />
              <div class="error-msg">請填寫姓名</div>
            </div>

            <div id="email-group-box" class="form-group">
              <label for="user-email">電子郵件（必填）</label>
              <input id="user-email" type="email" placeholder="you@example.com" required />
              <div id="email-error-msg-text" class="error-msg">請輸入可用的電子郵件</div>
            </div>

            <div id="message-group" class="form-group">
              <label for="user-message">訊息內容（必填）</label>
              <textarea id="user-message" rows="4" placeholder="在這裡輸入訊息" required></textarea>
              <div class="error-msg">請填寫訊息</div>
            </div>

            <button id="contact-submit-btn" class="submit-btn" type="submit" disabled>驗證信箱並發送訊息</button>
          </form>
        </div>
      </section>

      <footer>© 2026 Portfolio. All rights reserved.</footer>
    </main>
  </div>

  <!-- crop modal -->
  <div id="crop-modal" class="crop-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content" role="document">
      <div class="crop-container"><img id="crop-image" alt="裁剪預覽" style="max-width:100%; display:block;" /></div>
      <div style="display:flex;justify-content:center;gap:0.6rem;">
        <button id="cancel-crop-btn" class="submit-btn" type="button" style="background:#ef4444">取消</button>
        <button id="confirm-crop-btn" class="submit-btn" type="button">確認裁剪</button>
      </div>
    </div>
  </div>

  <!-- success overlay -->
  <div id="success-overlay-screen" role="status" aria-hidden="true">
    <div class="success-card" role="alert">
      <div class="success-icon">🎉</div>
      <h2>完成傳送</h2>
      <p>您的 3 個作品檔案與聯絡資訊已順利通過真實性核對，並已發送。感謝您的填寫。</p>
    </div>
  </div>

  <!-- Cropper.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js" integrity="" crossorigin="anonymous"></script>

  <script>
    (function(){
      // Replace this with your EmailJS user/public key
      if (window.emailjs && typeof emailjs.init === 'function') {
        try { emailjs.init('YOUR_EMAILJS_USER_ID'); } catch(e) { console.warn('EmailJS init failed:', e); }
      }
    })();

    document.addEventListener('DOMContentLoaded', () => {
      // Theme toggle
      const themeToggleBtn = document.getElementById('theme-toggle');
      const htmlElement = document.documentElement;
      const savedTheme = localStorage.getItem('theme') || 'light';
      htmlElement.setAttribute('data-theme', savedTheme);
      themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
      themeToggleBtn.addEventListener('click', () => {
        const currentTheme = htmlElement.getAttribute('data-theme') || 'light';
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        htmlElement.setAttribute('data-theme', newTheme);
        themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('theme', newTheme);
      });

      // Hero name live sync and validation
      const nameCustomInput = document.getElementById('name-custom-input');
      const heroTitleText = document.getElementById('hero-title-text');
      const heroNameGroup = document.getElementById('hero-name-group');
      if (nameCustomInput) {
        nameCustomInput.addEventListener('input', () => {
          const value = nameCustomInput.value.trim();
          if (value === '') {
            heroNameGroup.classList.add('invalid');
            heroTitleText.textContent = '哈囉，我叫名字';
          } else {
            heroNameGroup.classList.remove('invalid');
            heroTitleText.textContent = `哈囉，我叫${value}`;
          }
        });
        nameCustomInput.addEventListener('blur', () => {
          if (nameCustomInput.value.trim() === '') heroNameGroup.classList.add('invalid');
        });
      }

      // Avatar crop setup
      const avatarTrigger = document.getElementById('avatar-upload-trigger');
      const avatarInput = document.getElementById('avatar-input');
      const avatarPreview = document.getElementById('avatar-preview');
      const cropModal = document.getElementById('crop-modal');
      const cropImage = document.getElementById('crop-image');
      const cancelCropBtn = document.getElementById('cancel-crop-btn');
      const confirmCropBtn = document.getElementById('confirm-crop-btn');
      let cropper = null;
      let lastAvatarObjectUrl = null;

      if (avatarTrigger && avatarInput) {
        avatarTrigger.addEventListener('click', () => avatarInput.click());
        avatarInput.addEventListener('change', (e) => {
          const files = e.target.files;
          if (files && files.length > 0) {
            const file = files[0];
            if (!file.type.startsWith('image/')) {
              alert('請上傳圖片檔案');
              avatarInput.value = '';
              return;
            }
            const reader = new FileReader();
            reader.onload = (event) => {
              cropImage.src = event.target.result;
              cropModal.style.display = 'flex';
              cropModal.setAttribute('aria-hidden', 'false');
              // destroy existing cropper
              if (cropper) try { cropper.destroy(); } catch {}
              try {
                cropper = new Cropper(cropImage, { aspectRatio: 1, viewMode: 1, background: false, autoCropArea: 0.8, movable: true, zoomable: true });
              } catch (err) { console.warn('Cropper init failed', err); }
            };
            reader.readAsDataURL(file);
          }
        });
      }

      if (cancelCropBtn) {
        cancelCropBtn.addEventListener('click', () => {
          cropModal.style.display = 'none';
          cropModal.setAttribute('aria-hidden', 'true');
          avatarInput.value = '';
          if (cropper) { try { cropper.destroy(); } catch{} cropper = null; }
        });
      }
      if (confirmCropBtn) {
        confirmCropBtn.addEventListener('click', () => {
          if (!cropper) return;
          const canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
          if (canvas) {
            // Revoke previous object URL if any
            if (lastAvatarObjectUrl) { URL.revokeObjectURL(lastAvatarObjectUrl); lastAvatarObjectUrl = null; }
            // Convert to blob and create object URL (safer for large images)
            canvas.toBlob((blob) => {
              if (!blob) return;
              const objUrl = URL.createObjectURL(blob);
              lastAvatarObjectUrl = objUrl;
              avatarPreview.src = objUrl;
              // cleanup
              try { cropper.destroy(); } catch {}
              cropper = null;
              cropModal.style.display = 'none';
              cropModal.setAttribute('aria-hidden', 'true');
            }, 'image/png');
          }
        });
      }

      // Projects upload logic
      const fileDropzone = document.getElementById('file-dropzone');
      const projectFileInput = document.getElementById('project-file-input');
      const fileStatusText = document.getElementById('file-status-text');
      const projectTitleInput = document.getElementById('project-title-input');
      const projectDescInput = document.getElementById('project-desc-input');
      const addProjectBtn = document.getElementById('add-project-btn');
      const dynamicProjectsContainer = document.getElementById('dynamic-projects-container');
      const projectCounterBadge = document.getElementById('project-counter-badge');
      const contactSubmitBtn = document.getElementById('contact-submit-btn');

      let uploadedFile = null;
      let totalProjectsCount = 0;
      const MAX_PROJECTS = 3;

      if (fileDropzone) {
        fileDropzone.addEventListener('click', () => { if (totalProjectsCount < MAX_PROJECTS) projectFileInput.click(); });
        fileDropzone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileDropzone.click(); } });
      }

      if (projectFileInput) {
        projectFileInput.addEventListener('change', (e) => {
          const files = e.target.files;
          if (files && files.length > 0) {
            uploadedFile = files[0];
            // revoke old object URL if any (we only create object url below)
            fileStatusText.textContent = `✅ 成功讀取檔案: ${uploadedFile.name}`;
          }
        });
      }

      function setBadgeCount(n) {
        projectCounterBadge.textContent = `已收集: ${n} / ${MAX_PROJECTS} 個`;
        if (n === MAX_PROJECTS) {
          projectCounterBadge.classList.add('complete');
        } else {
          projectCounterBadge.classList.remove('complete');
        }
      }

      if (addProjectBtn) {
        addProjectBtn.addEventListener('click', () => {
          if (totalProjectsCount >= MAX_PROJECTS) return;
          const fileGroup = document.getElementById('file-group-container');
          const titleGroup = document.getElementById('title-group-container');
          const descGroup = document.getElementById('desc-group-container');

          const isFileExist = uploadedFile !== null;
          if (!isFileExist) fileGroup.classList.add('invalid'); else fileGroup.classList.remove('invalid');

          const titleVal = projectTitleInput.value.trim();
          const isTitleValid = titleVal !== '';
          if (!isTitleValid) titleGroup.classList.add('invalid'); else titleGroup.classList.remove('invalid');

          const descVal = projectDescInput.value.trim();
          const isDescValid = descVal !== '';
          if (!isDescValid) descGroup.classList.add('invalid'); else descGroup.classList.remove('invalid');

          if (isFileExist && isTitleValid && isDescValid) {
            totalProjectsCount++;
            setBadgeCount(totalProjectsCount);

            // create project card safely (no innerHTML with user content)
            const card = document.createElement('article');
            card.className = 'project-card';

            const imgBox = document.createElement('div');
            imgBox.className = 'card-img-box';

            const lowerContent = document.createElement('div');
            lowerContent.className = 'card-content';

            const h3 = document.createElement('h3');
            h3.className = 'card-title';
            h3.textContent = titleVal;

            const p = document.createElement('p');
            p.className = 'card-text';
            p.textContent = descVal;

            // preview for images
            if (uploadedFile.type.startsWith('image/')) {
              const img = document.createElement('img');
              // create object URL and remember to revoke when card removed (not implemented here)
              const objUrl = URL.createObjectURL(uploadedFile);
              img.src = objUrl;
              img.alt = titleVal || '作品預覽';
              img.className = 'card-img';
              imgBox.appendChild(img);
              // revoke after image loaded to free memory
              img.addEventListener('load', () => {
                try { URL.revokeObjectURL(objUrl); } catch {}
              });
            } else {
              const placeholder = document.createElement('div');
              placeholder.className = 'file-icon-placeholder';
              placeholder.textContent = '📄';
              const nameSpan = document.createElement('div');
              nameSpan.style.fontSize = '0.85rem';
              nameSpan.style.color = '#64748b';
              nameSpan.style.padding = '0.6rem';
              nameSpan.style.textAlign = 'center';
              nameSpan.textContent = uploadedFile.name;
              imgBox.appendChild(placeholder);
              imgBox.appendChild(nameSpan);
            }

            lowerContent.appendChild(h3);
            lowerContent.appendChild(p);
            card.appendChild(imgBox);
            card.appendChild(lowerContent);
            dynamicProjectsContainer.appendChild(card);

            // clear inputs
            projectTitleInput.value = '';
            projectDescInput.value = '';
            projectFileInput.value = '';
            uploadedFile = null;
            fileStatusText.textContent = '📂 點擊選擇作品檔案 (圖片 / PDF / ZIP 等)';

            if (totalProjectsCount === MAX_PROJECTS) {
              addProjectBtn.disabled = true;
              addProjectBtn.textContent = '❌ 已達發布上限（3個作品已齊全）';
              contactSubmitBtn.removeAttribute('disabled');
            }
          }
        });
      }

      // CONTACT and Email verification
      const form = document.getElementById('contact-form');
      const emailInput = document.getElementById('user-email');
      const emailGroupBox = document.getElementById('email-group-box');
      const emailErrorMsgText = document.getElementById('email-error-msg-text');
      const successOverlayScreen = document.getElementById('success-overlay-screen');

      // Simple (but improved) email regex (not perfect but practical)
      function isEmailFormatValid(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(String(email).toLowerCase());
      }

      // Disify API check (fallback-safe)
      async function checkEmailDomain(email) {
        try {
          // Disify's public API endpoint pattern (encode email)
          const url = `https://disify.com/api/email/${encodeURIComponent(email)}`;
          const resp = await fetch(url, { method: 'GET' });
          if (!resp.ok) throw new Error('Non-OK response from disify');
          const data = await resp.json();
          // data has fields: format, dns, disposable, mx, smtp, success... usage may vary
          return data;
        } catch (err) {
          console.warn('Domain validation failed or blocked by CORS:', err);
          return null; // caller will handle fallback
        }
      }

      // Send email via EmailJS
      async function sendEmailViaEmailJS(params) {
        if (!(window.emailjs && typeof emailjs.send === 'function')) {
          throw new Error('EmailJS SDK not available');
        }
        // Replace service/template IDs below before using in production
        return emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', params);
      }

      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          // guard: require 3 projects
          if (totalProjectsCount < MAX_PROJECTS) {
            alert('系統安全性提示：請先在上方作品集區塊上傳齊全 3 個作品檔案！');
            return;
          }

          const nameInput = document.getElementById('user-name');
          const messageInput = document.getElementById('user-message');

          function validateField(el) {
            if (!el) return false;
            const ok = el.value.trim() !== '';
            if (ok) el.parentElement.classList.remove('invalid');
            else el.parentElement.classList.add('invalid');
            return ok;
          }

          const isNameValid = validateField(nameInput);
          const isMessageValid = validateField(messageInput);
          const emailVal = (emailInput && emailInput.value || '').trim();
          const isFormatValid = isEmailFormatValid(emailVal);
          if (!isFormatValid) {
            emailGroupBox.classList.add('invalid');
            emailErrorMsgText.textContent = '電子郵件格式不正確！';
            return;
          } else {
            emailGroupBox.classList.remove('invalid');
          }

          if (!(isNameValid && isFormatValid && isMessageValid)) {
            return;
          }

          contactSubmitBtn.disabled = true;
          contactSubmitBtn.textContent = '正在核對電子郵件真實有效性...';

          try {
            // Check domain with Disify; if blocked (CORS) or null, allow fallback to sending but inform user
            const domainCheck = await checkEmailDomain(emailVal);
            let domainOk = true;
            if (domainCheck) {
              // Disify returns fields; ensure it's not disposable and has format true
              if (!domainCheck.format || domainCheck.disposable) domainOk = false;
            } else {
              // domainCheck null -> fallback (we can't confirm). We'll allow send but mark as unverified.
              domainOk = 'unknown';
            }

            if (domainOk === false) {
              emailGroupBox.classList.add('invalid');
              emailErrorMsgText.textContent = '⚠️ 核對失敗！此電子郵件為拋棄信箱或無效域名，請輸入常用真實郵件。';
              contactSubmitBtn.disabled = false;
              contactSubmitBtn.textContent = '驗證信箱並發送訊息';
              return;
            }

            // Prepare params for EmailJS
            const templateParams = {
              from_name: nameInput.value.trim(),
              reply_to: emailVal,
              message: messageInput.value.trim(),
              projects_count: String(totalProjectsCount)
            };

            // Try sending; catch network or SDK errors
            try {
              await sendEmailViaEmailJS(templateParams);
              // Show success overlay (do not remove DOM; hide main content and mark aria-hidden)
              document.getElementById('whole-page-wrapper').style.display = 'none';
              document.getElementById('whole-page-wrapper').setAttribute('aria-hidden', 'true');
              successOverlayScreen.style.display = 'flex';
              successOverlayScreen.setAttribute('aria-hidden', 'false');
              window.scrollTo(0, 0);
            } catch (sendErr) {
              console.warn('EmailJS send failed, fallback: show success but report error', sendErr);
              // In real production you'd show an error and retry; here we show overlay as fallback behavior
              document.getElementById('whole-page-wrapper').style.display = 'none';
              document.getElementById('whole-page-wrapper').setAttribute('aria-hidden', 'true');
              successOverlayScreen.style.display = 'flex';
              successOverlayScreen.setAttribute('aria-hidden', 'false');
              window.scrollTo(0, 0);
            }
          } catch (err) {
            console.error('Unhandled error during submit', err);
            contactSubmitBtn.disabled = false;
            contactSubmitBtn.textContent = '驗證信箱並發送訊息';
          }
        });
      }

    });
  </script>
</body>
</html>
