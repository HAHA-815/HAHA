<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>個人自我介紹網站</title>

  <!-- Cropper.js CSS (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" integrity="sha512-1q8k0/2qk5Oj1gq9C2nM0Qv1r8O5kU14p5cVx4pXw2xvQ0Qy7YfJk0vM4Q6oY+u5w1i0h9V+6P9z6pB1wXkN1A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* 1. 全域變數與重設 */
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --primary-color: #4f46e5;
      --nav-bg: rgba(255, 255, 255, 0.8);
      --transition-speed: 0.3s;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --primary-color: #818cf8;
      --nav-bg: rgba(15, 23, 42, 0.8);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color var(--transition-speed), color var(--transition-speed);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* 2. 導覽列樣式 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10%;
      background-color: var(--nav-bg);
      backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] .navbar {
      border-bottom-color: rgba(255, 255, 255, 0.05);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .nav-links a {
      color: var(--text-color);
      text-decoration: none;
      margin-left: 1.25rem;
      font-weight: 500;
      transition: color var(--transition-speed);
    }

    .nav-links a:hover {
      color: var(--primary-color);
    }

    .theme-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 5px;
      border-radius: 50%;
      transition: transform var(--transition-speed);
      color: var(--text-color);
    }

    .theme-btn:hover {
      transform: scale(1.1);
    }

    /* 3. 首頁樣式 (Hero Section) */
    .hero-section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 120px 20px 40px 20px;
    }

    .hero-container {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease forwards;
      max-width: 700px;
      width: 100%;
    }

    /* 大頭貼上傳外觀結構 */
    .avatar-upload-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .avatar-preview-box {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--primary-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      background-color: #f1f5f9;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-upload-btn {
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      border-radius: 20px;
      cursor: pointer;
      transition: all var(--transition-speed);
      background: transparent;
    }

    .avatar-upload-btn:hover {
      background-color: var(--primary-color);
      color: white;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 2rem;
      word-break: break-all;
    }

    /* 首頁動態輸入控制框 */
    .hero-input-box {
      background-color: var(--bg-color);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.05);
      text-align: left;
      max-width: 500px;
      margin: 0 auto;
    }

    [data-theme="dark"] .hero-input-box {
      border-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .hero-input-box label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .hero-input-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
    }

    [data-theme="dark"] .hero-input-box input {
      border-color: #334155;
    }

    .hero-input-box input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .hero-input-box.invalid input {
      border-color: #ef4444;
    }

    .hero-input-box.invalid input:focus {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .error-msg {
      display: none;
      color: #ef4444;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    .hero-input-box.invalid .error-msg {
      display: block;
    }

    /* 4. 作品區樣式 */
    .projects-section {
      padding: 80px 10%;
      background-color: rgba(0, 0, 0, 0.02);
    }

    [data-theme="dark"] .projects-section {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .section-title {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 3rem;
      position: relative;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 4px;
      background-color: var(--primary-color);
      border-radius: 2px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .project-card {
      background-color: var(--bg-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
    }

    .project-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .card-img-box {
      width: 100%;
      height: 200px;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-speed) ease;
    }

    .project-card:hover .card-img {
      transform: scale(1.05);
    }

    .card-content {
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: var(--text-color);
    }

    .card-text {
      font-size: 0.95rem;
      color: #64748b;
    }

    [data-theme="dark"] .card-text {
      color: #94a3b8;
    }

    /* 5. 聯絡區樣式 */
    .contact-section {
      padding: 80px 10%;
    }

    .contact-container {
      max-width: 600px;
      margin: 0 auto;
    }

    .contact-form {
      background-color: var(--bg-color);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    [data-theme="dark"] .contact-form {
      border-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-color);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
    }

    [data-theme="dark"] .form-group input,
    [data-theme="dark"] .form-group textarea {
      border-color: #334155;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .form-group.invalid input,
    .form-group.invalid textarea {
      border-color: #ef4444;
    }

    .form-group.invalid input:focus,
    .form-group.invalid textarea:focus {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .form-group .error-msg {
      display: none;
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    .form-group.invalid .error-msg {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--transition-speed), transform var(--transition-speed);
    }

    .submit-btn:hover {
      background-color: #4338ca;
      transform: translateY(-1px);
    }

    .success-banner {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem;
      background-color: #bbf7d0;
      color: #166534;
      border-radius: 8px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 500;
    }

    [data-theme="dark"] .success-banner {
      background-color: #14532d;
      color: #bbf7d0;
    }

    /* 6. 圖片裁剪彈出遮罩樣式 */
    .crop-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal-content {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem;
      border-radius: 16px;
      width: 90%;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .modal-content h3 {
      margin-bottom: 1rem;
    }

    .crop-container {
      max-height: 360px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cropper-view-box,
    .cropper-face {
      border-radius: 50%;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    .modal-btn {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .cancel-btn {
      background-color: #e2e8f0;
      color: #475569;
    }

    .confirm-btn {
      background-color: var(--primary-color);
      color: white;
    }

    /* 7. 頁尾與 RWD */
    .footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      color: #64748b;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      margin-top: 3rem;
    }

    [data-theme="dark"] .footer {
      border-top-color: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 968px) {
      .navbar { padding: 0 5%; }
      .projects-grid { grid-template-columns: 1fr; gap: 1.5rem; }
      .hero-title { font-size: 2.2rem; }
    }

    @media (max-width: 480px) {
      .nav-links a { margin-left: 1rem; font-size: 0.9rem; }
      .hero-title { font-size: 1.75rem; }
      .avatar-preview-box { width: 120px; height: 120px; }
    }
  </style>
</head>
<body>
  <nav class="navbar" role="navigation" aria-label="主導覽列">
    <div class="logo">Portfolio</div>
    <div style="display:flex; align-items:center; gap:1rem;">
      <div class="nav-links" aria-hidden="true">
        <a href="#home">首頁</a>
        <a href="#projects">作品</a>
        <a href="#contact">聯絡</a>
      </div>
      <button id="theme-toggle" class="theme-btn" aria-label="切換深色模式">🌙</button>
    </div>
  </nav>

  <main>
    <section id="home" class="hero-section" aria-labelledby="hero-heading">
      <div class="hero-container">
        <div class="avatar-upload-wrapper" aria-hidden="false">
          <div class="avatar-preview-box" title="大頭貼預覽">
            <img id="avatar-preview" class="avatar-preview-img" src="" alt="大頭貼預覽" />
            <!-- If no image, consider showing initials or placeholder via JS/CSS -->
          </div>

          <label class="avatar-upload-btn" for="avatar-input" role="button">上傳大頭貼</label>
          <input id="avatar-input" type="file" accept="image/*" style="display:none;" aria-label="上傳大頭貼" />
        </div>

        <h1 id="hero-title-text" class="hero-title">哈囉，我叫名字</h1>

        <div id="hero-input-group" class="hero-input-box" aria-live="polite">
          <label for="name-custom-input">自訂顯示名稱（必填）</label>
          <input id="name-custom-input" type="text" placeholder="在此輸入你的名字..." />
          <div class="error-msg">名稱為必填</div>
        </div>
      </div>
    </section>

    <section id="projects" class="projects-section" aria-labelledby="projects-heading">
      <h2 id="projects-heading" class="section-title">作品集</h2>
      <div class="projects-grid">
        <!-- sample cards -->
        <article class="project-card">
          <div class="card-img-box">
            <img class="card-img" src="https://via.placeholder.com/800x400?text=Project+1" alt="Project 1"/>
          </div>
          <div class="card-content">
            <h3 class="card-title">範例專案 1</h3>
            <p class="card-text">簡短說明文字。</p>
          </div>
        </article>
        <article class="project-card">
          <div class="card-img-box">
            <img class="card-img" src="https://via.placeholder.com/800x400?text=Project+2" alt="Project 2"/>
          </div>
          <div class="card-content">
            <h3 class="card-title">範例專案 2</h3>
            <p class="card-text">簡短說明文字。</p>
          </div>
        </article>
        <article class="project-card">
          <div class="card-img-box">
            <img class="card-img" src="https://via.placeholder.com/800x400?text=Project+3" alt="Project 3"/>
          </div>
          <div class="card-content">
            <h3 class="card-title">範例專案 3</h3>
            <p class="card-text">簡短說明文字。</p>
          </div>
        </article>
      </div>
    </section>

    <section id="contact" class="contact-section" aria-labelledby="contact-heading">
      <h2 id="contact-heading" class="section-title">聯絡我</h2>
      <div class="contact-container">
        <form id="contact-form" class="contact-form" novalidate>
          <div class="form-group">
            <label for="user-name">姓名</label>
            <input id="user-name" type="text" />
            <div class="error-msg">請輸入姓名</div>
          </div>

          <div class="form-group">
            <label for="user-email">電子郵件</label>
            <input id="user-email" type="email" />
            <div class="error-msg">請輸入有效的電子郵件</div>
          </div>

          <div class="form-group">
            <label for="user-message">訊息</label>
            <textarea id="user-message" rows="6"></textarea>
            <div class="error-msg">請輸入訊息</div>
          </div>

          <button type="submit" class="submit-btn">送出</button>

          <div id="success-banner" class="success-banner" role="status">已送出，感謝你！</div>
        </form>
      </div>
    </section>
  </main>

  <!-- Crop modal -->
  <div id="crop-modal" class="crop-modal" role="dialog" aria-hidden="true">
    <div class="modal-content" role="document" aria-label="裁剪視窗">
      <h3>調整大頭貼範圍</h3>
      <div class="crop-container">
        <img id="crop-image" alt="裁剪預覽" style="max-width:100%; display:block;" />
      </div>
      <div class="modal-actions">
        <button id="cancel-crop-btn" class="modal-btn cancel-btn" type="button">取消</button>
        <button id="confirm-crop-btn" class="modal-btn confirm-btn" type="button">確定裁切</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    © 2026 Portfolio. All rights reserved.
  </footer>

  <!-- Cropper.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js" integrity="sha512-6w5f2k5o6i1W9k7z4xX1qg8ZpR+4V1YF5G8v9n0Yc3kqzqH9d6V2bJ9m3XwYl3O5z7T+Yx3Lz0Q2k7Z1k3gQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- 1. 深色模式切換功能 ---
      const themeToggleBtn = document.getElementById('theme-toggle');
      const htmlElement = document.documentElement;
      const savedTheme = localStorage.getItem('theme') || 'light';
      htmlElement.setAttribute('data-theme', savedTheme);
      themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

      themeToggleBtn.addEventListener('click', () => {
        const currentTheme = htmlElement.getAttribute('data-theme');
        let newTheme = 'light';
        if (currentTheme === 'light') {
          newTheme = 'dark';
          themeToggleBtn.textContent = '☀️';
        } else {
          newTheme = 'light';
          themeToggleBtn.textContent = '🌙';
        }
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
      });

      // --- 2. 首頁名字自訂輸入、即時同步與必填驗證 ---
      const nameCustomInput = document.getElementById('name-custom-input');
      const heroTitleText = document.getElementById('hero-title-text');
      const heroInputGroup = document.getElementById('hero-input-group');

      nameCustomInput.addEventListener('input', () => {
        const value = nameCustomInput.value.trim();
        if (value === '') {
          // 如果被清空，觸發紅框警告，並將標題恢復原樣
          heroInputGroup.classList.add('invalid');
          heroTitleText.textContent = '哈囉，我叫名字';
        } else {
          // 即時動態渲染更新名字，並解除紅框警告
          heroInputGroup.classList.remove('invalid');
          heroTitleText.textContent = `哈囉，我叫${value}`;
        }
      });

      // 失去焦點時的強力防呆驗證
      nameCustomInput.addEventListener('blur', () => {
        if (nameCustomInput.value.trim() === '') {
          heroInputGroup.classList.add('invalid');
        }
      });

      // --- 3. 大頭貼上傳與範圍選取裁剪邏輯 ---
      const avatarInput = document.getElementById('avatar-input');
      const avatarPreview = document.getElementById('avatar-preview');
      const cropModal = document.getElementById('crop-modal');
      const cropImage = document.getElementById('crop-image');
      const cancelCropBtn = document.getElementById('cancel-crop-btn');
      const confirmCropBtn = document.getElementById('confirm-crop-btn');
      let cropper = null;

      avatarInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (files && files.length > 0) {
          const file = files[0];
          // Basic file type check
          if (!file.type.startsWith('image/')) {
            alert('請上傳圖片檔案');
            avatarInput.value = '';
            return;
          }
          const reader = new FileReader();
          reader.onload = (event) => {
            cropImage.src = event.target.result;
            cropModal.style.display = 'flex';
            cropModal.setAttribute('aria-hidden', 'false');
            if (cropper) cropper.destroy();
            cropper = new Cropper(cropImage, {
              aspectRatio: 1, // 1:1
              viewMode: 1,
              background: false,
              autoCropArea: 0.8,
              ready() {
                // Optional: ensure circle overlay visually (CSS handles border radius)
              }
            });
          };
          reader.readAsDataURL(file);
        }
      });

      cancelCropBtn.addEventListener('click', () => {
        cropModal.style.display = 'none';
        cropModal.setAttribute('aria-hidden', 'true');
        if (cropper) {
          cropper.destroy();
          cropper = null;
        }
        avatarInput.value = '';
      });

      confirmCropBtn.addEventListener('click', () => {
        if (!cropper) return;
        const canvas = cropper.getCroppedCanvas({
          width: 300,
          height: 300,
          imageSmoothingQuality: 'high'
        });
        if (canvas) {
          avatarPreview.src = canvas.toDataURL('image/png');
        }
        cropModal.style.display = 'none';
        cropModal.setAttribute('aria-hidden', 'true');
        cropper.destroy();
        cropper = null;
      });

      // Close modal when clicking outside content (optional)
      cropModal.addEventListener('click', (e) => {
        if (e.target === cropModal) {
          cancelCropBtn.click();
        }
      });

      // --- 4. 聯絡表單驗證邏輯 ---
      const form = document.getElementById('contact-form');
      const nameInput = document.getElementById('user-name');
      const emailInput = document.getElementById('user-email');
      const messageInput = document.getElementById('user-message');
      const successBanner = document.getElementById('success-banner');

      const validateField = (input, condition) => {
        const formGroup = input.parentElement;
        if (condition) {
          formGroup.classList.remove('invalid');
          return true;
        } else {
          formGroup.classList.add('invalid');
          return false;
        }
      };

      // corrected email regex (escape dot)
      const isValidEmail = (email) => {
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return regex.test(email);
      };

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const isNameValid = validateField(nameInput, nameInput.value.trim() !== '');
        const isEmailValid = validateField(emailInput, isValidEmail(emailInput.value.trim()));
        const isMessageValid = validateField(messageInput, messageInput.value.trim() !== '');
        if (isNameValid && isEmailValid && isMessageValid) {
          successBanner.style.display = 'block';
          form.reset();
          // reset hero name placeholder if needed
          heroTitleText.textContent = '哈囉，我叫名字';
          setTimeout(() => {
            successBanner.style.display = 'none';
          }, 3000);
        }
      });

      const inputs = [nameInput, emailInput, messageInput];
      inputs.forEach(input => {
        input.addEventListener('input', () => {
          input.parentElement.classList.remove('invalid');
        });
      });

      // Small accessibility focus: skip fixed nav overlap on anchor links
      const navLinks = document.querySelectorAll('.nav-links a');
      navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          // Wait a tick, then scroll a bit up to account for fixed navbar
          setTimeout(() => {
            const target = document.querySelector(link.getAttribute('href'));
            if (target) {
              const offset = 80; // navbar height
              const top = target.getBoundingClientRect().top + window.pageYOffset - offset;
              window.scrollTo({ top, behavior: 'smooth' });
            }
          }, 10);
        });
      });
    });
  </script>
</body>
</html>
