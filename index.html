<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>個人自我介紹網站</title>

  <!-- Cropper.js CSS (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />

  <style>
    /* 1. 全域變數與重設 */
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --primary-color: #4f46e5;
      --nav-bg: rgba(255, 255, 255, 0.8);
      --transition-speed: 0.3s;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --primary-color: #818cf8;
      --nav-bg: rgba(15, 23, 42, 0.8);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color var(--transition-speed), color var(--transition-speed);
      line-height: 1.6;
    }

    /* 2. 導覽列樣式 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10%;
      background-color: var(--nav-bg);
      backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] .navbar {
      border-bottom-color: rgba(255, 255, 255, 0.05);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .nav-links a {
      color: var(--text-color);
      text-decoration: none;
      margin-left: 2rem;
      font-weight: 500;
      transition: color var(--transition-speed);
    }

    .nav-links a:hover {
      color: var(--primary-color);
    }

    .theme-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: transform var(--transition-speed);
    }

    .theme-btn:hover {
      transform: scale(1.1);
    }

    /* 3. 首頁樣式 (Hero Section) */
    .hero-section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 120px 20px 60px; /* 留出 navbar 高度 */
    }

    .hero-container {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 900px;
      width: 100%;
    }

    /* 大頭貼圓形選取外觀 */
    .avatar-upload-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
    }

    .avatar-preview-box {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--primary-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      background-color: #f1f5f9;
      display: grid;
      place-items: center;
    }

    .avatar-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-upload-btn {
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      border-radius: 20px;
      cursor: pointer;
      transition: all var(--transition-speed);
      background: transparent;
    }

    .avatar-upload-btn:hover {
      background-color: var(--primary-color);
      color: white;
    }

    /* 首頁標題與直接編輯名字 */
    .hero-title {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
      word-break: break-word;
    }

    .editable-name {
      color: var(--primary-color);
      border-bottom: 2px dashed var(--primary-color);
      padding: 0 10px;
      cursor: text;
      outline: none;
      transition: background-color var(--transition-speed);
      border-radius: 4px;
      display: inline-block;
      min-width: 4ch;
    }

    .editable-name:focus {
      background-color: rgba(79, 70, 229, 0.06);
      border-bottom-style: solid;
    }

    .editable-name.invalid {
      color: #ef4444 !important;
      border-bottom-color: #ef4444 !important;
      background-color: rgba(239, 68, 68, 0.05) !important;
    }

    .name-error-hint {
      display: none;
      color: #ef4444;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 0.5rem;
      animation: shake 0.3s ease;
    }

    .editable-name.invalid + .name-error-hint {
      display: block;
    }

    /* 4. 作品區樣式 */
    .projects-section {
      padding: 80px 10%;
      background-color: rgba(0, 0, 0, 0.02);
    }

    [data-theme="dark"] .projects-section {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .section-title {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
      position: relative;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 4px;
      background-color: var(--primary-color);
      border-radius: 2px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .project-card {
      background-color: var(--bg-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
      transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
    }

    .project-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .card-img-box {
      width: 100%;
      height: 160px;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-speed) ease;
    }

    .project-card:hover .card-img {
      transform: scale(1.05);
    }

    .card-content {
      padding: 1rem;
    }

    .card-title {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: var(--text-color);
    }

    .card-text {
      font-size: 0.95rem;
      color: #64748b;
    }

    [data-theme="dark"] .card-text {
      color: #94a3b8;
    }

    /* 5. 聯絡區樣式 */
    .contact-section {
      padding: 80px 10%;
    }

    .contact-container {
      max-width: 700px;
      margin: 0 auto;
    }

    .contact-form {
      background-color: var(--bg-color);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    [data-theme="dark"] .contact-form {
      border-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .form-group {
      margin-bottom: 1rem;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-color);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
    }

    [data-theme="dark"] .form-group input,
    [data-theme="dark"] .form-group textarea {
      border-color: #334155;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .form-group.invalid input,
    .form-group.invalid textarea {
      border-color: #ef4444;
    }

    .form-group.invalid input:focus,
    .form-group.invalid textarea:focus {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
    }

    .error-msg {
      display: none;
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    .form-group.invalid .error-msg {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--transition-speed), transform var(--transition-speed);
    }

    .submit-btn:hover {
      background-color: #4338ca;
      transform: translateY(-1px);
    }

    .success-banner {
      display: none;
      margin-top: 1rem;
      padding: 0.9rem;
      background-color: #bbf7d0;
      color: #166534;
      border-radius: 8px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 500;
    }

    [data-theme="dark"] .success-banner {
      background-color: #14532d;
      color: #bbf7d0;
    }

    /* 6. 圖片裁剪彈出遮罩樣式 (Crop Modal) */
    .crop-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 1rem;
    }

    .modal-content {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 1rem;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .crop-container {
      max-height: 360px;
      margin-bottom: 1rem;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cropper-view-box,
    .cropper-face {
      border-radius: 50%;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    .modal-btn {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .cancel-btn {
      background-color: #e2e8f0;
      color: #475569;
    }

    .confirm-btn {
      background-color: var(--primary-color);
      color: white;
    }

    /* 7. 頁尾與 RWD */
    .footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      color: #64748b;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] .footer {
      border-top-color: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      60% {
        transform: translateX(-6px);
      }

      40%,
      80% {
        transform: translateX(6px);
      }
    }

    @media (max-width: 968px) {
      .navbar {
        padding: 0 5%;
      }

      .projects-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .hero-title {
        font-size: 2.2rem;
      }

      .hero-container {
        padding: 0 1rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar" role="navigation" aria-label="主選單">

    <button id="theme-toggle" class="theme-btn" aria-label="切換深色模式">🌙</button>

  <!-- HERO -->
  <header class="hero-section" id="home">
    <div class="hero-container">
      <div class="avatar-upload-wrapper" aria-hidden="false">
        <div class="avatar-preview-box" aria-hidden="false">

            %3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 24 24'%3E%3Crect fill='%23f1f5f9' width='100%25' height='100%25'/%3E%3Ccircle cx='12' cy='8' r='4' fill='%23c7d2fe'/%3E%3Cpath d='M4 20c0-3.3137 2.6863-6 6-6h4c3.3137 0 6 2.6863 6 6' fill='%23c7d2fe'/%3E%3C/svg%3E" />

  <section id="contact" class="contact-section">

  <!-- Cropper.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- 1. 深色模式切換功能 ---
      const themeToggleBtn = document.getElementById('theme-toggle');
      const htmlElement = document.documentElement;
      const savedTheme = localStorage.getItem('theme') || 'light';
      htmlElement.setAttribute('data-theme', savedTheme);
      themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

      themeToggleBtn.addEventListener('click', () => {
        const currentTheme = htmlElement.getAttribute('data-theme');
        let newTheme = 'light';
        if (currentTheme === 'light') {
          newTheme = 'dark';
          themeToggleBtn.textContent = '☀️';
        } else {
          newTheme = 'light';
          themeToggleBtn.textContent = '🌙';
        }
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
      });

      // --- 2. 原地名字編輯與必須輸入驗證邏輯 ---
      const editableName = document.getElementById('editable-name');
      const nameError = document.getElementById('name-error');
      // 防止空白初始或刪除後為空白
      const normalizeName = () => {
        const txt = (editableName.textContent || '').trim();
        if (txt === '') {
          editableName.classList.add('invalid');
          nameError.style.display = 'block';
          editableName.textContent = '名字';
          return false;
        } else {
          editableName.classList.remove('invalid');
          nameError.style.display = 'none';
          return true;
        }
      };

      editableName.addEventListener('input', () => {
        if ((editableName.textContent || '').trim() !== '') {
          editableName.classList.remove('invalid');
          nameError.style.display = 'none';
        }
      });

      editableName.addEventListener('blur', () => {
        normalizeName();
      });

      editableName.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          editableName.blur();
        }
      });

      // --- 3. 大頭貼上傳與範圍選取裁剪邏輯 (首頁) ---
      const avatarInput = document.getElementById('avatar-input');
      const avatarPreview = document.getElementById('avatar-preview');
      const avatarUploadBtn = document.getElementById('avatar-upload-btn');

      const cropModal = document.getElementById('crop-modal');
      const cropImage = document.getElementById('crop-image');
      const cancelCropBtn = document.getElementById('cancel-crop-btn');
      const confirmCropBtn = document.getElementById('confirm-crop-btn');
      let cropper = null;

      // 點擊按鈕觸發 input
      avatarUploadBtn.addEventListener('click', () => {
        avatarInput.click();
      });

      avatarInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (files && files.length > 0) {
          const file = files[0];
          const reader = new FileReader();
          reader.onload = (event) => {
            cropImage.src = event.target.result;
            cropModal.style.display = 'flex';
            cropModal.setAttribute('aria-hidden', 'false');
            // initialize cropper
            if (cropper) cropper.destroy();
            cropper = new Cropper(cropImage, {
              aspectRatio: 1,
              viewMode: 1,
              background: false,
              autoCropArea: 0.9,
              responsive: true,
              movable: true,
              zoomable: true,
            });
          };
          reader.readAsDataURL(file);
        }
      });

      cancelCropBtn.addEventListener('click', () => {
        cropModal.style.display = 'none';
        cropModal.setAttribute('aria-hidden', 'true');
        if (cropper) {
          cropper.destroy();
          cropper = null;
        }
        avatarInput.value = '';
      });

      confirmCropBtn.addEventListener('click', () => {
        if (!cropper) return;
        const canvas = cropper.getCroppedCanvas({
          width: 300,
          height: 300,
          imageSmoothingQuality: 'high'
        });
        avatarPreview.src = canvas.toDataURL('image/png');
        cropModal.style.display = 'none';
        cropModal.setAttribute('aria-hidden', 'true');
        cropper.destroy();
        cropper = null;
        avatarInput.value = '';
      });

      // 點擊 modal 背景也可關閉
      cropModal.addEventListener('click', (ev) => {
        if (ev.target === cropModal) {
          cancelCropBtn.click();
        }
      });

      // --- 4. 聯絡表單驗證邏輯 ---
      const form = document.getElementById('contact-form');
      const nameInput = document.getElementById('user-name');
      const emailInput = document.getElementById('user-email');
      const messageInput = document.getElementById('user-message');
      const successBanner = document.getElementById('success-banner');

      const validateField = (input, condition) => {
        const formGroup = input.parentElement;
        if (condition) {
          formGroup.classList.remove('invalid');
          return true;
        } else {
          formGroup.classList.add('invalid');
          return false;
        }
      };

      const isValidEmail = (email) => {
        // 修正：將 . 做 escape
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return regex.test(email);
      };

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const isNameValid = validateField(nameInput, nameInput.value.trim() !== '');
        const isEmailValid = validateField(emailInput, isValidEmail(emailInput.value.trim()));
        const isMessageValid = validateField(messageInput, messageInput.value.trim() !== '');

        // 同時檢查 editable name（網站主名稱）
        const isDisplayNameValid = normalizeName();

        if (isNameValid && isEmailValid && isMessageValid && isDisplayNameValid) {
          successBanner.style.display = 'block';
          form.reset();
          setTimeout(() => {
            successBanner.style.display = 'none';
          }, 3000);
        } else {
          // 若有錯誤，卷動到第一個錯誤欄位
          const firstErr = document.querySelector('.form-group.invalid');
          if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });

      const inputs = [nameInput, emailInput, messageInput];
      inputs.forEach(input => {
        input.addEventListener('input', () => {
          input.parentElement.classList.remove('invalid');
        });
      });

      // Accessibility: 按下 Esc 可關閉 crop modal
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && cropModal.style.display === 'flex') {
          cancelCropBtn.click();
        }
      });
    });
  </script>
</body>
</html>
